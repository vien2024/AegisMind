services:
  aegismind:
    build: .
    image: aegismind:latest
    container_name: aegismind
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch("http://127.0.0.1:3000/api/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    volumes:
      - aegismind-data:/app/data

  postgres:
    image: postgres:17-alpine
    container_name: aegismind-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_USER: aegismind
      POSTGRES_PASSWORD: aegismind
      POSTGRES_DB: aegismind
    volumes:
      - aegismind-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegismind -d aegismind"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

volumes:
  aegismind-data:
  aegismind-postgres-data:
